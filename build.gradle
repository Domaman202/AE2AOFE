plugins {
    // Apply the plugin. You can find the latest version at https://projects.neoforged.net/neoforged/ModDevGradle
    id 'net.neoforged.moddev' version '1.0.11'
}


def gitBranch() {
    def branch = ""
    def proc = "git rev-parse --abbrev-ref HEAD".execute()
    proc.in.eachLine { line -> branch = line }
    proc.err.eachLine { line -> println line }
    proc.waitFor()
    branch
}

version = "${mod_version}-${gitBranch().replace("/", ".")}"
group = "ru.DmN.${modid}" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "${modid}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.50"

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        ae2ao {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { // modmaven, maven proxy
        name 'modmaven'
        url "https://modmaven.dev/"
    }
}

dependencies {
    implementation("appeng:appliedenergistics2-neoforge:${ae2_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}


jar {
    finalizedBy 'reobfJar'
    manifest {
        attributes([
                "Specification-Title"     : "${modid}",
                // "Specification-Vendor"    : "examplemodsareus",
                // "Specification-Version"   : "1",
                // "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${mod_version}",
                // "Implementation-Vendor"   : "examplemodsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${modid}.mixins.json"
        ])
    }
}
